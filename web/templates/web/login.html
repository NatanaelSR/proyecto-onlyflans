{% extends 'base.html' %}

{% block content %}
<div class="container">
  <div class="col-12 col-md-4 offset-md-4 mt-4 mb-4 text-center">
    <h3>Iniciar sesión</h3>

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}

      <div class="text-danger">{{ form.non_field_errors }}</div>

      <div class="mb-3">
        <label for="{{ form.username.id_for_label }}" class="form-label">Username:</label>
        <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control">
        <div class="text-danger">{{ form.username.errors }}</div>
      </div>

      <div class="mb-3">
        <label for="{{ form.password.id_for_label }}" class="form-label">Password:</label>
        <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control">
        <div class="text-danger">{{ form.password.errors }}</div>
      </div>

      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary">Iniciar sesión</button>
    </form>
  </div>
</div>
{% endblock %}
