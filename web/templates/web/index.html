{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="container my-5">
    <h1 class="text-center mb-4 fw-bold">Nuestros Flanes</h1>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for flan in flanes %}
        <div class="col">
            <div class="card h-100 shadow-sm border-0">
                <img src="{{ flan.image_url }}" class="card-img-top" alt="{{ flan.name }}"
                    style="height: 200px; object-fit: cover;">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fw-bold">{{ flan.name }}</h5>
                    <p class="card-text text-muted flex-grow-1">{{ flan.description }}</p>
                    <p class="fw-bold text-success fs-5 mt-2">${{ flan.precio }}</p>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center my-5">
            <p class="text-muted">No hay flanes disponibles por el momento.</p>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
