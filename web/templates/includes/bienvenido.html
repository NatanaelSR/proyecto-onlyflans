{% load static %}

{% if user.is_authenticated %}
<div class="modal fade" id="userWelcomeModal" tabindex="-1" aria-labelledby="userWelcomeModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow">
            <div class="modal-header border-0 pb-0">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body text-center px-4 pb-4 pt-0">
                <i class="fa-solid fa-circle-user fa-3x of-text-caramel mb-3"></i>
                <h4 class="fw-bold mb-2 of-text-heading" id="userWelcomeModalLabel">
                    ¡Hola, {{ user.first_name|default:user.username }}!
                </h4>
                <p class="text-muted mb-4">Qué bueno verte de nuevo. Tienes acceso a nuestros flanes exclusivos.</p>
                <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                    <a href="/bienvenido" class="btn btn-caramel px-4">Ver flanes exclusivos</a>
                    <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endif %}
